# OpsFlow local development reverse proxy (PRD §57.2).
#
# Browser -> nginx :80 (published as :8080)
#   /api/... , /up , /sanctum/...  -> Laravel php-fpm (backend:9000)
#   /app/... (Reverb websocket)    -> reverb:8080
#   everything else (SPA + HMR)    -> Vite dev server (frontend:5173)

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 25m;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location @laravel {
        fastcgi_pass backend:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_read_timeout 300;
    }

    location = /up {
        try_files /nonexistent @laravel;
    }

    location /api/ {
        try_files /nonexistent @laravel;
    }

    location = /sanctum/csrf-cookie {
        try_files /nonexistent @laravel;
    }

    # Channel authorization for Reverb private/presence channels
    location /broadcasting/ {
        try_files /nonexistent @laravel;
    }

    # Laravel Reverb websocket endpoint (default path /app/<app-key>)
    location /app/ {
        proxy_pass http://reverb:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # SPA (Vite dev server, including HMR websocket upgrades)
    location / {
        proxy_pass http://frontend:5173;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
    }
}
